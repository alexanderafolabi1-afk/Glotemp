<html lang="en">
<head>

  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
  <title>💻 Tech in Kinshasa - Glotemp</title>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Dataset",
    "name": "💻 Tech in Kinshasa",
    "description": "Should I build or work here?",
    "url": "https://glo-temp.com/cities/kinshasa/tech/",
    "spatialCoverage": "Kinshasa, DRC"
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://hnysztednzqfzbmiqqgl.supabase.co" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1&family=Manrope:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=47" />
</head>
<body>
  <nav id="site-nav"></nav>
  <script src="/nav-component.js"></script>

  <main class="page-main">
    <section class="glass-card page-header">
      <p class="eyebrow"><a href="/cities/kinshasa.html" data-city-link="kinshasa" data-city-nav="false" style="color:var(--sand);">Kinshasa, DRC</a> · 💻 Tech</p>
      <h1>💻 Tech in Kinshasa</h1>
      <p class="section-copy" style="color:var(--sand); max-width:64ch;">Should I build or work here?</p>
    </section>

    <section id="tech" class="vertical-section glass-card">
      <div id="tech-content" class="vertical-content"></div>
      <div id="tech-context" class="vertical-context"></div>
    </section>

    <section class="glass-card" style="padding:2rem; text-align:center;">
      <div class="secondary-links-row">
        <a href="/cities/kinshasa.html" class="secondary-link">🏙️ Full Kinshasa profile</a>
        <a href="/rankings/tech/" class="secondary-link">🏆 💻 Tech rankings, all cities</a>
      </div>
    </section>
  </main>

  <footer class="footer glass">
    <p>© 2026 RenviaIT Ltd. All rights reserved.</p>
    <p class="small-print">
      <a href="/privacy">Privacy Policy</a> | <a href="/terms">Terms of Service</a> | <a href="#" id="cookie-settings">Cookie Settings</a>
    </p>
    <p class="small-print footer-lang-row">
      <button type="button" id="lang-switch" class="footer-lang">Language</button>
    </p>
  </footer>

  <script src="/cities-data.js"></script>
  <script src="/glotemp-core.js"></script>
  <script src="/city-wiki.js" defer></script>
  <script src="/city-worldbank.js" defer></script>
  <script src="/verticals-engine.js" defer></script>
  <script>
    // SUPABASE_URL / SUPABASE_ANON_KEY come from verticals-engine.js
    // (deferred, but resolved by the time DOMContentLoaded fires below) --
    // redeclaring them here would collide with that script's top-level
    // const and throw, since classic <script> tags share one scope.

    // Icon + colour per metric key, purely cosmetic -- the raw key itself
    // (mood_reading, education_quality_score, etc.) never reaches the
    // page. Kept identical to generate-city-pages.js's copy.
    const METRIC_META = {
      mood_reading: { icon: '💗', rgb: '224,110,150' },
      event_energy: { icon: '⚡', rgb: '230,180,70' },
      developer_activity: { icon: '🛠️', rgb: '90,160,230' },
      job_openings: { icon: '💼', rgb: '70,190,170' },
      startup_activity: { icon: '🚀', rgb: '150,110,230' },
      cost_of_living: { icon: '🛒', rgb: '110,190,120' },
      currency_strength: { icon: '💵', rgb: '90,190,140' },
      inflation_rate: { icon: '📉', rgb: '230,120,90' },
      remote_work_adoption: { icon: '🏠', rgb: '100,170,230' },
      salary_competitiveness: { icon: '💰', rgb: '100,200,140' },
      work_culture_score: { icon: '⚖️', rgb: '170,130,230' },
      housing_availability: { icon: '🏗️', rgb: '230,170,90' },
      median_rent: { icon: '🏢', rgb: '120,130,220' },
      property_appreciation: { icon: '📈', rgb: '100,200,130' },
      education_quality_score: { icon: '🎓', rgb: '100,150,230' },
      international_students: { icon: '🌍', rgb: '90,190,180' },
      university_count: { icon: '🏛️', rgb: '130,140,220' },
      active_participation: { icon: '🏃', rgb: '230,150,90' },
      major_events: { icon: '🏆', rgb: '230,190,80' },
      sports_venues: { icon: '🏟️', rgb: '110,190,120' },
      event_frequency: { icon: '🎫', rgb: '220,110,180' },
      nightlife_score: { icon: '🌃', rgb: '160,110,220' },
      venue_count: { icon: '🎪', rgb: '180,120,220' },
      designer_brands: { icon: '🏷️', rgb: '230,120,170' },
      fashion_events: { icon: '👠', rgb: '220,100,160' },
      style_influence: { icon: '✨', rgb: '230,190,100' },
      culinary_diversity: { icon: '🍜', rgb: '230,150,90' },
      michelin_stars: { icon: '⭐', rgb: '230,190,80' },
      restaurant_count: { icon: '🍴', rgb: '230,130,90' },
      air_quality_index: { icon: '🌬️', rgb: '110,190,190' },
      hospital_quality: { icon: '🏥', rgb: '230,120,130' },
      wellness_index: { icon: '🧘', rgb: '110,190,150' },
      bike_share_bikes: { icon: '🚲', rgb: '110,190,120' },
      congestion_level: { icon: '🚦', rgb: '230,140,90' },
      transit_quality: { icon: '🚇', rgb: '100,150,230' },
    };
    const METRIC_META_FALLBACK = { icon: '📊', rgb: '176,141,87' };

    // Override GlotempCore's pinned-city default with this page's own city.
    (function () {
      var rec = (window.CITIES_DATA || []).find(function (c) { return c.slug === 'kinshasa'; });
      if (rec && typeof GlotempCore !== 'undefined') GlotempCore.applyMoodBackground(rec.mood);
    })();

    // Real, sourced context for this one vertical -- a Wikipedia section
    // excerpt where a genuine one exists, plus a World Bank country
    // indicator where this vertical has a defensible one. Neither
    // replaces the live reading above; both render nothing if there's no
    // honest match, same rule as every empty state on the site.
    document.addEventListener('DOMContentLoaded', async function () {
      const loaders = [];
      if (typeof GlotempWiki !== 'undefined') loaders.push(GlotempWiki.loadVerticalContext('Kinshasa', 'DRC', 'tech'));
      if (typeof GlotempWorldBank !== 'undefined') loaders.push(GlotempWorldBank.loadVerticalIndicator('CD', 'tech', 'DRC'));
      await Promise.all(loaders);
      // Fashion and Pulse (and any city whose article lacks this
      // vertical's section) have no per-vertical source at all -- fall
      // back to the general Wikipedia summary so this page is never left
      // with nothing but an empty reading.
      if (typeof GlotempWiki !== 'undefined') {
        await GlotempWiki.fillEmptyVerticalContexts('Kinshasa', 'DRC', ['tech']);
      }
    });

    async function loadVerticalContent() {
      const contentEl = document.getElementById('tech-content');
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/readings?city_slug=eq.kinshasa&vertical=eq.tech&order=fetched_at.desc&limit=50`,
          { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, Accept: 'application/json' } }
        );
        if (!response.ok) {
          contentEl.innerHTML = '';
          if (typeof GlotempCore !== 'undefined') GlotempCore.reconcileVerticalOrder('tech');
          return;
        }
        const readings = await response.json();
        if (!readings.length) {
          contentEl.innerHTML = '';
          if (typeof GlotempCore !== 'undefined') GlotempCore.reconcileVerticalOrder('tech');
          return;
        }
        contentEl.innerHTML = readings.slice(0, 15).map(reading => {
          const meta = METRIC_META[reading.metric] || METRIC_META_FALLBACK;
          const shownValue = reading.value !== null && reading.value !== undefined ? Number(reading.value).toFixed(1) : null;
          const confidenceNote = typeof reading.confidence === 'number' ? `${Math.round(reading.confidence * 100)}% confidence` : '';
          return `
          <div class="reading" style="--metric-rgb:${meta.rgb};" ${confidenceNote ? `title="${confidenceNote}"` : ''}>
            <span class="reading-icon" aria-hidden="true">${meta.icon}</span>
            <div class="reading-main">
              ${shownValue !== null ? `<span class="reading-value">${shownValue}</span>` : ''}
              <span class="reading-label">${reading.label || ''}</span>
            </div>
            <time class="reading-time" datetime="${reading.fetched_at}">${verticals.getTimeAgo(new Date(reading.fetched_at))}</time>
          </div>
        `;
        }).join('');
      } catch (error) {
        console.error('Error loading tech data:', error);
        contentEl.innerHTML = '<div class="empty-state">Error loading data. Try again shortly.</div>';
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadVerticalContent);
    } else {
      loadVerticalContent();
    }
    GlotempCore.wireCityLinks(document);
    const lang = localStorage.getItem('glotemp-lang') || 'en';
    document.documentElement.lang = lang;
  </script>
  <script src="/cookie-consent.js" defer></script>
  <script src="/tempo-economy.js" defer></script>
</body>
</html>
