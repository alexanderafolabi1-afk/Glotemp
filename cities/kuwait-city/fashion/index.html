  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Dataset",
    "name": "Fashion in Kuwait City",
    "description": "Where is the center of global style?",
    "url": "https://glo-temp.com/cities/kuwait-city/fashion/",
    "spatialCoverage": "Kuwait City, Kuwait"
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://hnysztednzqfzbmiqqgl.supabase.co" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1&family=Manrope:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=12" />
</head>
<body>
  <nav class="navbar glass">
    <div class="nav-brand">
      <img src="/assets/logo.png" alt="Glotemp" class="nav-logo">
      <span class="logo-text">Glotemp</span>
      <span class="pulse-dot" aria-hidden="true">❤️</span>
    </div>
    <div class="nav-links">
      <a href="/">Pulse</a>
      <a href="/about">About</a>
      <a href="/explore">Explore</a>
      <a href="/feed">Feed</a>
      <button id="lang-switch" class="btn-icon" title="Change language">◉</button>
    </div>
  </nav>

  <main class="page-main">
    <section class="glass-card page-header">
      <p class="eyebrow"><a href="/cities/kuwait-city.html" data-city-link="kuwait-city" data-city-nav="false" style="color:var(--sand);">Kuwait City, Kuwait</a> · Fashion</p>
      <h1>Fashion in Kuwait City</h1>
      <p class="section-copy" style="color:var(--sand); max-width:64ch;">Where is the center of global style?</p>
    </section>

    <section id="fashion" class="vertical-section glass-card">
      <div id="fashion-content" class="vertical-content"></div>
    </section>

    <section class="glass-card" style="display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; padding:2rem; text-align:center;">
      <a href="/cities/kuwait-city.html" class="btn-neon" style="text-decoration:none; display:inline-block;">Full Kuwait City profile</a>
      <a href="/rankings/fashion/" class="btn-neon" style="text-decoration:none; display:inline-block;">Fashion rankings, all cities</a>
    </section>
  </main>

  <footer class="footer glass">
    <p>© 2026 RenviaIT Ltd. All rights reserved.</p>
    <p class="small-print">
      <a href="/privacy">Privacy Policy</a> | <a href="/terms">Terms of Service</a> | <a href="#" id="cookie-settings">Cookie Settings</a>
    </p>
  </footer>

  <script src="/cities-data.js"></script>
  <script src="/glotemp-core.js"></script>
  <script src="/verticals-engine.js" defer></script>
  <script>
    // SUPABASE_URL / SUPABASE_ANON_KEY come from verticals-engine.js
    // (deferred, but resolved by the time DOMContentLoaded fires below) --
    // redeclaring them here would collide with that script's top-level
    // const and throw, since classic <script> tags share one scope.

    async function loadVerticalContent() {
      const contentEl = document.getElementById('fashion-content');
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/readings?city_slug=eq.kuwait-city&vertical=eq.fashion&order=fetched_at.desc&limit=50`,
          { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, Accept: 'application/json' } }
        );
        if (!response.ok) {
          contentEl.innerHTML = '<div class="empty-state">No data available for this vertical yet.</div>';
          return;
        }
        const readings = await response.json();
        if (!readings.length) {
          contentEl.innerHTML = '<div class="empty-state">No readings yet for Kuwait City.</div>';
          return;
        }
        contentEl.innerHTML = readings.slice(0, 15).map(reading => `
          <div class="reading glass-card">
            <div class="reading-header">
              <span class="reading-metric">${reading.metric}</span>
              <span class="reading-confidence" title="Data confidence: ${(reading.confidence * 100).toFixed(0)}%">${verticals.getConfidenceLabel(reading.confidence)}</span>
            </div>
            <div class="reading-value">
              ${reading.value !== null ? `<span class="value">${reading.value}${reading.label ? ` ${reading.label}` : ''}</span>` : ''}
              <span class="reading-label">${reading.label || ''}</span>
            </div>
            <div class="reading-footer">
              <span class="reading-source">${reading.source}</span>
              <time class="reading-time" datetime="${reading.fetched_at}">${verticals.getTimeAgo(new Date(reading.fetched_at))}</time>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading fashion data:', error);
        contentEl.innerHTML = '<div class="empty-state">Error loading data. Try again shortly.</div>';
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadVerticalContent);
    } else {
      loadVerticalContent();
    }
    GlotempCore.wireCityLinks(document);
    const lang = localStorage.getItem('glotemp-lang') || 'en';
    document.documentElement.lang = lang;
  </script>
  <script src="/cookie-consent.js" defer></script>
  <script src="/tempo-economy.js" defer></script>
</body>
</html>
