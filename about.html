<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <title>Glotemp – About</title>
</head>
<body>
  <nav class="navbar glass">
    <div class="nav-brand"><span class="logo-text">🌐 Glotemp</span></div>
    <div class="nav-links">
      <a href="index.html">Pulse</a>
      <a href="about.html" class="active">About</a>
      <a href="investors.html">Investors</a>
    </div>
  </nav>
  <main class="glass-card" style="padding:2rem; max-width:800px; margin:2rem auto;">
    <h1 data-i18n="about_title">About Glotemp</h1>
    <p data-i18n="about_text">We are building the world’s first real-time mood infrastructure, turning city feelings into actionable intelligence for travelers, businesses, and communities.</p>
  </main>
  <script>
    // minimal i18n inject
    const translationsAbout = {
      en: { about_title: "About Glotemp", about_text: "We are building the world’s first real-time mood infrastructure..." },
      es: { about_title: "Acerca de Glotemp", about_text: "Construimos la primera infraestructura de humor en tiempo real..." },
      // add others if needed
    };
    const lang = localStorage.getItem('glotemp-lang') || 'en';
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = translationsAbout[lang]?.[el.dataset.i18n] || el.textContent;
    });
  </script>
</body>
</html>
