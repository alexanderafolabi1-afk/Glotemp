<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0f1a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Glotemp – City Stories</title>
  <script src="https://cdn.jsdelivr.net/npm/twemoji@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app">
    <nav class="navbar glass">
      <div class="nav-brand">
        <img src="assets/logo.svg" alt="Glotemp" class="logo-img" height="40" onerror="this.style.display='none';this.nextElementSibling.style.display='inline';">
        <span class="logo-text" style="display:none;">🌐 Glotemp</span>
        <span class="pulse-dot"></span>
      </div>
      <div class="nav-links">
        <a href="index.html">Pulse</a>
        <a href="about.html">About</a>
        <a href="investors.html">Investors</a>
        <a href="blog.html" class="active">Stories</a>
        <button id="lang-switch" class="btn-icon" title="Change language">🌍</button>
      </div>
    </nav>

    <main class="blog-main" style="max-width:1200px; margin:0 auto; padding:2rem 1rem;">
      <div class="blog-header glass-card" style="padding:1.5rem; margin-bottom:2rem;">
        <h1 data-i18n="blog_title">City Stories</h1>
        <input type="text" id="blog-search" class="city-dropdown" style="width:100%; margin-top:1rem; padding:0.8rem; border-radius:40px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); color:white; font-size:1rem;" data-i18n-placeholder="search_placeholder" placeholder="Search city...">
      </div>

      <div id="blog-posts-grid" class="blog-grid">
        <!-- Cards injected here -->
      </div>
      <div id="blog-empty" class="glass-card" style="display:none; padding:3rem; text-align:center;">
        <p style="font-size:3rem;">📝</p>
        <p data-i18n="no_stories">No stories found. Check back soon!</p>
      </div>
    </main>

    <footer class="footer glass">
      <p>© 2025 RenviaIT Ltd. All rights reserved.</p>
      <p class="small-print">
        <a href="privacy.html">Privacy Policy</a> |
        <a href="terms.html">Terms of Service</a> |
        <a href="#" id="cookie-settings">Cookie Settings</a>
      </p>
      <p class="small-print">Glotemp is a product of RenviaIT Ltd, registered in England.</p>
    </footer>
  </div>

  <script src="stories.js"></script>
  <script>
    // Minimal i18n for blog page (same translations as app.js but scoped)
    const translationsBlog = {
      en: {
        blog_title: "City Stories",
        search_placeholder: "Search city...",
        no_stories: "No stories found. Check back soon!",
        read_full: "Read full story",
        trivia: "Trivia",
        history: "History",
        close: "Close"
      },
      es: {
        blog_title: "Historias de la ciudad",
        search_placeholder: "Buscar ciudad...",
        no_stories: "No se encontraron historias. ¡Vuelve pronto!",
        read_full: "Leer historia completa",
        trivia: "Curiosidades",
        history: "Historia",
        close: "Cerrar"
      },
      fr: {
        blog_title: "Histoires de ville",
        search_placeholder: "Rechercher une ville...",
        no_stories: "Aucune histoire trouvée. Revenez bientôt!",
        read_full: "Lire l'histoire complète",
        trivia: "Anecdotes",
        history: "Histoire",
        close: "Fermer"
      },
      de: {
        blog_title: "Stadtgeschichten",
        search_placeholder: "Stadt suchen...",
        no_stories: "Keine Geschichten gefunden. Bald wieder vorbeischauen!",
        read_full: "Ganze Geschichte lesen",
        trivia: "Wissenswertes",
        history: "Geschichte",
        close: "Schließen"
      },
      pt: {
        blog_title: "Histórias da cidade",
        search_placeholder: "Buscar cidade...",
        no_stories: "Nenhuma história encontrada. Volte em breve!",
        read_full: "Ler história completa",
        trivia: "Curiosidades",
        history: "História",
        close: "Fechar"
      },
      ja: {
        blog_title: "都市の物語",
        search_placeholder: "都市を検索...",
        no_stories: "物語が見つかりません。また後で！",
        read_full: "全文を読む",
        trivia: "豆知識",
        history: "歴史",
        close: "閉じる"
      }
    };

    const currentLang = localStorage.getItem('glotemp-lang') || (navigator.language || 'en').split('-')[0];
    const t = (key) => translationsBlog[currentLang]?.[key] || translationsBlog.en[key] || key;

    function applyBlogTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      const searchInput = document.getElementById('blog-search');
      if (searchInput) searchInput.placeholder = t('search_placeholder');
    }

    function loadPosts() {
      const sorted = [...STORIES].sort((a, b) => new Date(b.date) - new Date(a.date));
      renderPosts(sorted);
    }
    function renderPosts(posts) {
      const grid = document.getElementById('blog-posts-grid');
      const empty = document.getElementById('blog-empty');
      grid.innerHTML = '';

      if (!posts.length) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      grid.style.display = 'grid';
      empty.style.display = 'none';

      posts.forEach(post => {
        const card = document.createElement('div');
        card.className = 'glass-card blog-card';
        card.dataset.city = post.city.toLowerCase();
        card.innerHTML = `
          <div class="blog-emoji">${post.emoji || '🌍'}</div>
          <div class="blog-city">${post.city}</div>
          <h3 class="blog-title">${post.title}</h3>
          <p class="blog-excerpt">${(post.excerpt || post.content || '').substring(0, 200)}</p>
          <div class="blog-date">${new Date(post.date).toLocaleDateString(currentLang, { year:'numeric', month:'long', day:'numeric' })}</div>
          <button class="btn-neon blog-read-btn">${t('read_full')}</button>
          <div class="blog-full-content" style="display:none; margin-top:1rem;">
            <p>${post.content}</p>
            <div class="blog-toggles">
              <button class="btn-text trivia-toggle">${t('trivia')}</button>
              <div class="trivia-content" style="display:none; white-space:pre-line;">${post.trivia || ''}</div>
              <button class="btn-text history-toggle">${t('history')}</button>
              <div class="history-content" style="display:none; white-space:pre-line;">${post.history_nugget || ''}</div>
            </div>
          </div>
        `;

        // Toggle full story
        const readBtn = card.querySelector('.blog-read-btn');
        const fullContent = card.querySelector('.blog-full-content');
        readBtn.addEventListener('click', () => {
          const isOpen = fullContent.style.display === 'block';
          fullContent.style.display = isOpen ? 'none' : 'block';
          readBtn.textContent = isOpen ? t('read_full') : t('close');
        });

        // Trivia toggle
        card.querySelector('.trivia-toggle').addEventListener('click', function() {
          const content = this.nextElementSibling;
          content.style.display = content.style.display === 'none' ? 'block' : 'none';
        });
        // History toggle
        card.querySelector('.history-toggle').addEventListener('click', function() {
          const content = this.nextElementSibling;
          content.style.display = content.style.display === 'none' ? 'block' : 'none';
        });

        grid.appendChild(card);
      });

      // Emoji rendering
      if (window.twemoji) {
        twemoji.parse(grid, { folder: 'svg', ext: '.svg' });
      }
    }

    // Search filter
    document.addEventListener('input', function(e) {
      if (e.target.id === 'blog-search') {
        const term = e.target.value.toLowerCase();
        document.querySelectorAll('.blog-card').forEach(card => {
          const city = card.dataset.city || '';
          card.style.display = city.includes(term) ? 'block' : 'none';
        });
      }
    });

    // Language switch (same as in app.js, but simplified)
    document.getElementById('lang-switch').addEventListener('click', () => {
      const langs = Object.keys(translationsBlog);
      const currentIdx = langs.indexOf(currentLang);
      const nextLang = langs[(currentIdx + 1) % langs.length];
      localStorage.setItem('glotemp-lang', nextLang);
      location.reload(); // quick refresh for demo; later you can make it dynamic
    });

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      applyBlogTranslations();
      loadPosts();
    });
  </script>
</body>
</html>
