<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1a" />
  <meta name="description" content="Glotemp – City Stories: Discover the real-time mood and energy of cities through daily pulse updates and local stories." />
  <meta name="keywords" content="city stories, urban mood, collective feeling, city pulse, travel insights" />
  <meta property="og:title" content="Glotemp – City Stories" />
  <meta property="og:description" content="Glotemp – City Stories: Discover the real-time mood and energy of cities through daily pulse updates and local stories." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://glotemp.com/blog.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Glotemp – City Stories" />
  <meta name="twitter:description" content="Glotemp – City Stories: Discover the real-time mood and energy of cities through daily pulse updates and local stories." />
  <link rel="canonical" href="https://glotemp.com/blog.html" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Glotemp – City Stories</title>
  <script src="https://cdn.jsdelivr.net/npm/twemoji@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app">
    <nav class="navbar glass">
      <div class="nav-brand">
        <img src="assets/logo.png" alt="Glotemp" class="nav-logo">
        <span class="logo-text">Glotemp</span>
        <span class="pulse-dot"></span>
      </div>
      <div class="nav-links">
        <a href="index.html">Pulse</a>
        <a href="about.html">About</a>
        <a href="explore.html">Explore</a>
        <a href="blog.html" class="active">Stories</a>
        <button id="lang-switch" class="btn-icon" title="Change language">◉</button>
      </div>
    </nav>

    <main class="blog-main" style="max-width:1200px; margin:0 auto; padding:2rem 1rem;">
      <div class="blog-header glass-card">
        <h1 data-i18n="blog_title">City Stories</h1>
        <input type="text" id="blog-search" class="city-dropdown blog-search-input" data-i18n-placeholder="search_placeholder" placeholder="Search city...">
      </div>

      <div id="blog-posts-grid" class="blog-grid">
        <!-- Cards injected here -->
      </div>
      <div id="blog-empty" class="blog-status">
        <p class="blog-status-emoji">📝</p>
        <p data-i18n="no_stories">No stories found. Check back soon!</p>
      </div>
    </main>

    <footer class="footer glass">
      <p>© 2025 RenviaIT Ltd. All rights reserved.</p>
      <p class="small-print">
        <a href="privacy.html">Privacy Policy</a> |
        <a href="terms.html">Terms of Service</a> |
        <a href="#" id="cookie-settings">Cookie Settings</a>
      </p>
      <p class="small-print">Glotemp is a product of RenviaIT Ltd, registered in England.</p>
    </footer>
  </div>

  <script src="stories.js"></script>
  <script>
    // Minimal i18n for blog page (same translations as app.js but scoped)
    const translationsBlog = {
      en: {
        blog_title: "City Stories",
        search_placeholder: "Search city...",
        no_stories: "No stories found. Check back soon!",
        read_full: "Read full story",
        trivia: "Trivia",
        history: "History",
        close: "Close"
      },
      es: {
        blog_title: "Historias de la ciudad",
        search_placeholder: "Buscar ciudad...",
        no_stories: "No se encontraron historias. ¡Vuelve pronto!",
        read_full: "Leer historia completa",
        trivia: "Curiosidades",
        history: "Historia",
        close: "Cerrar"
      },
      fr: {
        blog_title: "Histoires de ville",
        search_placeholder: "Rechercher une ville...",
        no_stories: "Aucune histoire trouvée. Revenez bientôt!",
        read_full: "Lire l'histoire complète",
        trivia: "Anecdotes",
        history: "Histoire",
        close: "Fermer"
      },
      de: {
        blog_title: "Stadtgeschichten",
        search_placeholder: "Stadt suchen...",
        no_stories: "Keine Geschichten gefunden. Bald wieder vorbeischauen!",
        read_full: "Ganze Geschichte lesen",
        trivia: "Wissenswertes",
        history: "Geschichte",
        close: "Schließen"
      },
      pt: {
        blog_title: "Histórias da cidade",
        search_placeholder: "Buscar cidade...",
        no_stories: "Nenhuma história encontrada. Volte em breve!",
        read_full: "Ler história completa",
        trivia: "Curiosidades",
        history: "História",
        close: "Fechar"
      },
      ja: {
        blog_title: "都市の物語",
        search_placeholder: "都市を検索...",
        no_stories: "物語が見つかりません。また後で！",
        read_full: "全文を読む",
        trivia: "豆知識",
        history: "歴史",
        close: "閉じる"
      }
    };

    const currentLang = localStorage.getItem('glotemp-lang') || (navigator.language || 'en').split('-')[0];
    const t = (key) => translationsBlog[currentLang]?.[key] || translationsBlog.en[key] || key;

    function applyBlogTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      const searchInput = document.getElementById('blog-search');
      if (searchInput) searchInput.placeholder = t('search_placeholder');
    }

function loadPosts() {
  try {
    const stories = (typeof STORIES !== 'undefined' && Array.isArray(STORIES)) ? STORIES : [];
    const sorted = [...stories].sort((a, b) => new Date(b.date) - new Date(a.date));
    renderPosts(sorted);
  } catch (err) {
    renderPosts([]); // show empty state
  }
}
    function renderPosts(posts) {
      const grid = document.getElementById('blog-posts-grid');
      const empty = document.getElementById('blog-empty');
      grid.innerHTML = '';

      if (!posts.length) {
        grid.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      grid.style.display = 'grid';
      empty.style.display = 'none';

      posts.forEach(post => {
        const card = document.createElement('div');
        card.className = 'glass-card blog-card';
        card.dataset.city = post.city.toLowerCase();
        card.innerHTML = `
          <div class="blog-emoji">${post.emoji || '🌍'}</div>
          <div class="blog-city">${post.city}</div>
          <h3 class="blog-title">${post.title}</h3>
          <p class="blog-excerpt">${(post.excerpt || post.content || '').substring(0, 200)}</p>
          <div class="blog-date">${new Date(post.date).toLocaleDateString(currentLang, { year:'numeric', month:'long', day:'numeric' })}</div>
          <button class="btn-neon blog-read-btn">${t('read_full')}</button>
          <div class="blog-full-content">
            <p>${post.content}</p>
            <div class="blog-toggles">
              <button class="btn-text trivia-toggle">${t('trivia')}</button>
              <div class="trivia-content" style="white-space:pre-line;">${post.trivia || ''}</div>
              <button class="btn-text history-toggle">${t('history')}</button>
              <div class="history-content" style="white-space:pre-line;">${post.history_nugget || ''}</div>
            </div>
            <div class="comment-section" data-city="${post.city_slug || post.city.toLowerCase()}"></div>
          </div>
        `;

        // Toggle full story
        const readBtn = card.querySelector('.blog-read-btn');
        const fullContent = card.querySelector('.blog-full-content');
        readBtn.addEventListener('click', () => {
          const isOpen = fullContent.style.display === 'block';
          fullContent.style.display = isOpen ? 'none' : 'block';
          readBtn.textContent = isOpen ? t('read_full') : t('close');
          if (fullContent.style.display === 'block' && fullContent.querySelector('.comment-section').innerHTML === '') {
            initCommentSection(fullContent.querySelector('.comment-section'));
          }
        });

        // Trivia toggle
        card.querySelector('.trivia-toggle').addEventListener('click', function() {
          const content = this.nextElementSibling;
          content.style.display = content.style.display === 'none' ? 'block' : 'none';
        });
        // History toggle
        card.querySelector('.history-toggle').addEventListener('click', function() {
          const content = this.nextElementSibling;
          content.style.display = content.style.display === 'none' ? 'block' : 'none';
        });

        grid.appendChild(card);
      });

      // Emoji rendering
      if (window.twemoji) {
        twemoji.parse(grid, { folder: 'svg', ext: '.svg' });
      }
    }

    // Search filter
    document.addEventListener('input', function(e) {
      if (e.target.id === 'blog-search') {
        const term = e.target.value.toLowerCase();
        document.querySelectorAll('.blog-card').forEach(card => {
          const city = card.dataset.city || '';
          card.style.display = city.includes(term) ? 'block' : 'none';
        });
      }
    });

    // Language switch (same as in app.js, but simplified)
    document.getElementById('lang-switch').addEventListener('click', () => {
      const langs = Object.keys(translationsBlog);
      const currentIdx = langs.indexOf(currentLang);
      const nextLang = langs[(currentIdx + 1) % langs.length];
      localStorage.setItem('glotemp-lang', nextLang);
      location.reload(); // quick refresh for demo; later you can make it dynamic
    });

    function initCommentSection(container) {
      const citySlug = container.dataset.city;
      container.innerHTML = `
        <div class="comment-section">
          <h4>💬 City Pulse Comments</h4>
          <div class="comment-input-wrap">
            <textarea class="comment-input" placeholder="Share the vibe (max 280 chars)..." maxlength="280"></textarea>
            <div class="mood-picker">
              <button class="mood-emoji" data-mood="🔥" title="Energized">🔥</button>
              <button class="mood-emoji" data-mood="😊" title="Good">😊</button>
              <button class="mood-emoji" data-mood="😐" title="Neutral">😐</button>
              <button class="mood-emoji" data-mood="😞" title="Low">😞</button>
              <button class="mood-emoji" data-mood="😡" title="Cautious">😡</button>
            </div>
            <button class="btn-neon comment-submit">Post Comment</button>
          </div>
          <div class="comment-list"></div>
        </div>
      `;

      let selectedMood = '😐';
      const moodBtns = container.querySelectorAll('.mood-emoji');
      const textarea = container.querySelector('.comment-input');
      const submitBtn = container.querySelector('.comment-submit');
      const commentList = container.querySelector('.comment-list');

      moodBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          moodBtns.forEach(b => b.style.opacity = '0.5');
          btn.style.opacity = '1';
          selectedMood = btn.dataset.mood;
        });
        if (btn.dataset.mood === selectedMood) btn.style.opacity = '1';
        else btn.style.opacity = '0.5';
      });

      submitBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        const text = textarea.value.trim();
        if (!text) return;

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Posting...';
          await submitComment(citySlug, text, selectedMood);
          textarea.value = '';
          selectedMood = '😐';
          moodBtns.forEach(b => { b.style.opacity = b.dataset.mood === '😐' ? '1' : '0.5'; });
          loadComments(citySlug, commentList);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Post Comment';
        } catch (err) {
          console.error('Error submitting comment:', err);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Post Comment';
        }
      });

      loadComments(citySlug, commentList);
    }

    function loadComments(citySlug, container) {
      getComments(citySlug).then(comments => {
        container.innerHTML = '';
        if (comments.length === 0) {
          const emptyMsg = document.createElement('p');
          emptyMsg.className = 'inline-feedback';
          emptyMsg.textContent = 'No comments yet. Be first to share!';
          container.appendChild(emptyMsg);
          return;
        }
        comments.slice(0, 10).forEach(comment => {
          const time = new Date(comment.created_at).toLocaleString(currentLang, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
          const item = document.createElement('div');
          item.className = 'comment-item';
          const flexDiv = document.createElement('div');
          flexDiv.style.display = 'flex';
          flexDiv.style.gap = '0.5rem';
          flexDiv.style.alignItems = 'flex-start';

          const moodDiv = document.createElement('div');
          moodDiv.style.fontSize = '1.5rem';
          moodDiv.style.flexShrink = '0';
          moodDiv.textContent = comment.mood_emoji;

          const contentDiv = document.createElement('div');
          contentDiv.style.flex = '1';
          contentDiv.style.minWidth = '0';

          const p = document.createElement('p');
          p.textContent = comment.text;

          const small = document.createElement('small');
          small.textContent = time;

          contentDiv.appendChild(p);
          contentDiv.appendChild(small);
          flexDiv.appendChild(moodDiv);
          flexDiv.appendChild(contentDiv);
          item.appendChild(flexDiv);
          container.appendChild(item);
        });
      });
    }

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      applyBlogTranslations();
      loadPosts();
    });
  </script>
  <script src="tempo-economy.js" defer></script>
</body>
</html>
