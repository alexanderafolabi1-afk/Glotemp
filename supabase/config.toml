# Supabase project config.
#
# This file did not exist. Without it the data-collection edge functions
# default to verify_jwt = true, so any caller without a end-user JWT --
# including a scheduler -- is rejected before the handler runs. These
# functions take no user input and write only public, published data, so
# they are explicitly opened to keyless invocation and scheduled from
# pg_cron (see 20260808150000_schedule_edge_functions.sql).

project_id = "hnysztednzqfzbmiqqgl"

[functions.gdelt-sentiment]
verify_jwt = false

[functions.github-tech-activity]
verify_jwt = false

[functions.world-bank-finance]
verify_jwt = false

[functions.remotive-work-data]
verify_jwt = false

[functions.overpass-property]
verify_jwt = false

[functions.overpass-food]
verify_jwt = false

# The public API. Different reason from the collectors above: this one is
# authenticated, just not by a Supabase JWT. Callers present a glo_live_
# key which api_authorise hashes and checks. Leaving verify_jwt at its
# default true would have Supabase's gateway reject every customer request
# before the handler ever runs, and reject it for the wrong reason, since
# an API key is not a JWT and never will parse as one.
[functions.api-v1]
verify_jwt = false

# Read by every visitor's browser on every city page, signed in or not,
# so it cannot require a JWT. It takes one city name, calls GDELT, and
# returns public headlines; there is nothing here to protect.
[functions.city-news]
verify_jwt = false

# The music collector. Unlike city-news this is NOT public: it writes the
# archive the charts are built from. pg_cron calls it with the service
# role key from Vault, which satisfies the JWT check, so verify_jwt stays
# at its default true and a stranger cannot poke the writer.
# Deliberately absent from this file's false-list for that reason.

[functions.hipolabs-education]
verify_jwt = false

[functions.sportsdb-sport]
verify_jwt = false

[functions.ticketmaster-entertainment]
verify_jwt = false

[functions.gdelt-fashion]
verify_jwt = false

[functions.waqi-health]
verify_jwt = false

[functions.transitland-transport]
verify_jwt = false

[functions.aggregate-city-mood]
verify_jwt = false

[functions.tonight-layer]
verify_jwt = false

# The social-automation backend. Called externally by Make (not
# pg_cron), which sends whatever key a human pasted into the HTTP
# module's headers -- that's very likely to be the sb_publishable_...
# key shown by default in the Supabase dashboard, which is not
# JWT-shaped and never will parse as one, same class of rejection
# music-sync and push-send hit before their own verify_jwt fix. Both
# functions do their own config checks (SUPABASE_URL/SERVICE_KEY,
# CAMPAIGN_START_DATE) and write only to social_content_queue, so
# there is nothing here that depends on Supabase's own JWT gate.
[functions.social-next-post]
verify_jwt = false

[functions.social-mark-posted]
verify_jwt = false

# Called only server-side by social-next-post, never directly by Make
# or a browser -- consistent with the rest of this file's collectors.
[functions.social-image-fetch]
verify_jwt = false

# ===== AUTH =====
# These settings are the fix for confirmation links pointing at
# http://localhost:3000. GoTrue falls back to site_url whenever the caller
# does not supply a redirect it recognises, and an unset site_url defaults
# to localhost -- which is what shipped in every real confirmation email.
#
# Apply with:  supabase link --project-ref hnysztednzqfzbmiqqgl
#              supabase config push
# Anything set here is also settable by hand in
# Dashboard > Authentication > URL Configuration.
[auth]
site_url = "https://glo-temp.com"
# The allow list. Production only -- no localhost entry, so a link can
# never be issued for a host a recipient cannot reach.
additional_redirect_urls = ["https://glo-temp.com/auth/confirm/"]
enable_signup = true

[auth.email]
enable_confirmations = true

# Branded templates live in supabase/email-templates/ and are the same
# design system as the site: warm brown-black ground, ivory and sand text,
# brass hairlines, Fraunces headings, Manrope body, no boxes, and a text
# link rather than a filled button.
[auth.email.template.confirmation]
subject = "Confirm your email - Glotemp"
content_path = "./supabase/email-templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your sign-in link - Glotemp"
content_path = "./supabase/email-templates/magic-link.html"

[auth.email.template.recovery]
subject = "Reset your password - Glotemp"
content_path = "./supabase/email-templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email - Glotemp"
content_path = "./supabase/email-templates/email-change.html"

# Custom SMTP, so mail comes from glo-temp.com rather than Supabase's
# shared sender (which is also rate limited to a handful of messages an
# hour and is why the mail reads as "Supabase Auth").
#
# Credentials are env() references on purpose -- no secret is committed.
# Set SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS in the environment
# before `supabase config push`, and add SPF and DKIM records for
# glo-temp.com at your DNS provider or the mail will land in spam.
[auth.email.smtp]
host = "env(SMTP_HOST)"
port = 587
user = "env(SMTP_USER)"
pass = "env(SMTP_PASS)"
admin_email = "info@glo-temp.com"
sender_name = "Glotemp"

# The page-view collector is called from every visitor's browser, which has
# no end-user JWT, so the platform's default JWT check would reject every
# call. It is safe to leave open: it accepts nothing but a path, a referrer
# and a display mode, writes a single row, and returns no data at all.
[functions.collect]
verify_jwt = false

# Part 3, Global Audio-Stream Integration. Called directly by every
# visitor's browser (city-soundscape.js), same reason as city-news:
# no end-user JWT to present. The real Freesound.org API key it needs
# lives server-side in vault (get_freesound_api_key()), never in this
# config or in client JS.
[functions.freesound-search]
verify_jwt = false
