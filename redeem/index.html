<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14100B" />
  <meta name="description" content="Check a Glotemp offer code. Enter the code a customer is showing you to see whether it is valid or already used." />
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://glo-temp.com/redeem" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
  <title>Check a code - Glotemp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://hnysztednzqfzbmiqqgl.supabase.co" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1&family=Manrope:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=57" />
</head>
<body>
  <nav id="site-nav"></nav>
<script src="/nav-component.js"></script>
<script src="/footer-social.js" defer></script>

  <main class="page-main">
    <section class="glass-card page-header">
      <p class="eyebrow">For partner staff</p>
      <h1>Check a code</h1>
      <p class="section-copy" style="color:var(--sand); max-width:52ch;">Enter the code a customer is showing you. No account, no app -- just this page.</p>
    </section>

    <section class="glass-card">
      <form id="redeem-form" class="observation-form">
        <label class="full-width">
          <span>Code</span>
          <input type="text" id="redeem-code-input" maxlength="12" required autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX" style="font-family: var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase;">
        </label>
        <div class="form-actions">
          <button type="submit" id="redeem-submit" class="btn-neon">Check code</button>
        </div>
      </form>
      <p id="redeem-result" class="redeem-result" role="status" aria-live="polite" hidden></p>
    </section>
  </main>

  <footer class="footer glass">
    <p>&copy; 2026 RenviaIT Ltd. All rights reserved.</p>
    <p class="small-print">
      <a href="/privacy">Privacy Policy</a> |
      <a href="/terms">Terms of Service</a> |
      <a href="#" id="cookie-settings">Cookie Settings</a>
    </p>
    <p class="small-print"><a href="mailto:info@glo-temp.com" class="contact-link">info@glo-temp.com</a></p>
  </footer>
  <script src="/glotemp-offer-redeem.js"></script>
  <script src="/cookie-consent.js" defer></script>
</body>
</html>
