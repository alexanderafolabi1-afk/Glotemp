name: Deploy Supabase edge functions

# Edge functions are the one part of this repo that GitHub Pages does not
# publish: Pages serves the static site, and functions live in Supabase.
# Until now the only way to ship one was `supabase functions deploy` from
# somebody's laptop, which meant the deployed code and the committed code
# could silently drift, and meant nothing shipped at all if nobody had the
# CLI installed. This closes that gap: whatever is on main is what is
# deployed.
#
# SETUP, ONCE, ALL IN THE GITHUB WEB UI
#   Settings > Secrets and variables > Actions > New repository secret
#     SUPABASE_ACCESS_TOKEN   from supabase.com/dashboard/account/tokens
#     SUPABASE_PROJECT_REF    the ref in your project URL
#   Nothing else. No terminal, no CLI install.
#
# The token is a personal access token with deploy rights, so it is a
# repository secret and never a committed value. GitHub masks it in logs.

on:
  push:
    branches: [main]
    # Only when something a function actually depends on changed. Deploying
    # on every unrelated commit would burn minutes and add risk for nothing.
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  # So a deploy can also be triggered by hand from the Actions tab, which
  # is the no-terminal way to ship without making an empty commit.
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check the secrets are set
        # Without this the deploy fails several steps later with a generic
        # auth error, which reads like a broken function rather than a
        # missing secret.
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$REF" ]   && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy every function in supabase/functions
        # Deploying the whole directory rather than naming one keeps this
        # workflow correct when a function is added later; a named list
        # would quietly stop covering new work.
        # verify_jwt per function comes from supabase/config.toml, so the
        # public API stays keyless to Supabase's gateway and authenticated
        # by its own key inside the handler.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            echo "::group::$name"
            supabase functions deploy "$name" \
              --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
            echo "::endgroup::"
          done

      - name: Confirm the public API answers
        # A deploy that returns success and an endpoint that 404s are not
        # the same thing. /v1/health needs no key, so this proves the
        # function is actually reachable.
        run: |
          url="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/api-v1/v1/health"
          code="$(curl -s -o /tmp/health.txt -w '%{http_code}' "$url" || true)"
          echo "GET $url -> $code"
          cat /tmp/health.txt || true
          if [ "$code" != "200" ]; then
            echo "The API deployed but did not answer 200 on /v1/health."
            exit 1
          fi
